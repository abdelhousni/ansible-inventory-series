---
# Both environments in one inventory. app and db say what a host does;
# prod and staging say which environment it belongs to. Every host is in
# one group of each kind.
all:
  children:
    app:
      hosts:
        app1:
        app2:
        stg-app1:
    db:
      hosts:
        db1:
        stg-db1:
    prod:
      hosts:
        app1:
        app2:
        db1:
    staging:
      hosts:
        stg-app1:
        stg-db1:
