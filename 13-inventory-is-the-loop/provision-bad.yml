---
- name: Provision the VMs from the manager's list
  hosts: managers
  gather_facts: false
  tasks:
    - name: Call the manager's API for each VM
      ansible.builtin.include_tasks: tasks/create_vm.yml
      vars:
        vm_name: "{{ item.name }}"
        vm_spec: "{{ item.cpus }} cpus, {{ item.memory_mb }} MB"
      loop: "{{ manager_vms }}"
