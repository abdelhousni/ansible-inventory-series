---
# app and db say what a host does; prod and staging say which environment
# it belongs to. The policy checks expect every host in exactly one of each.
all:
  children:
    app:
      hosts:
        app1:
        stg-app1:
    db:
      hosts:
        db1:
        stg-db1:
    prod:
      hosts:
        app1:
        db1:
    staging:
      hosts:
        stg-app1:
        stg-db1:
