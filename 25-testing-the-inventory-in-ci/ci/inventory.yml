# A workflow to copy into your inventory repository's .github/workflows/.
# It isn't active here: GitHub only runs workflows from the repository root.
# It assumes check.sh, policy.yml and schema/ at the root of your repository,
# the inventory in inventory/, and a requirements.txt with ansible-core and
# check-jsonschema (this repository's has both). No vault password is needed.
name: inventory

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ansible-core and check-jsonschema
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
      - name: Schema and policy checks
        run: PATH="$PWD/.venv/bin:$PATH" ./check.sh inventory out
