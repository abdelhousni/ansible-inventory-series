---
# The layout of the old foreman.py inventory script: Foreman's fields in a
# foreman dict, the parameters in foreman_params, and another group prefix.
plugin: theforeman.foreman.foreman
url: http://127.0.0.1:18160
use_reports_api: false
want_params: true
legacy_hostvars: true
group_prefix: fm_
hostnames:
  - name.split('.')[0]
