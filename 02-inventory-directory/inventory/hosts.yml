---
# The PostgreSQL server, three application servers, and a jump host used
# to reach them. No variables here: they live in group_vars/.
all:
  hosts:
    jump1:              # in no group of its own
  children:
    app:
      hosts:
        app1:
        app2:
        app3:
    postgresql:         # a parent group: every host of db is in it too
      children:
        db:
          hosts:
            db1:
    backup:             # db1 again: a host can be in several groups
      hosts:
        db1:
