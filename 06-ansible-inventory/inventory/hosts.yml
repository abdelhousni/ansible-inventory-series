---
# Items 1 to 4's inventory, with one mistake planted: app3 sits under db,
# beside db1, instead of under app. No variables here: they live in
# group_vars/.
all:
  hosts:
    jump1:              # in no group of its own
  children:
    app:
      hosts:
        app1:
        app2:
    postgresql:         # a parent group: every host of db is in it too
      children:
        db:
          hosts:
            db1:
            app3:       # planted: belongs under app
    backup:
      hosts:
        db1:
