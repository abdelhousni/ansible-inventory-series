---
# Groups and variables built from what 10-pve.proxmox.yml returned, and from
# group_vars/. It runs after 10-, so it sees its hosts and their groups.
plugin: ansible.builtin.constructed
strict: false
use_vars_plugins: true
# With an empty prefix, group names don't start with "_".
leading_separator: false
keyed_groups:
  # One group per tag; a guest without tags goes to tag_untagged.
  - key: proxmox_tags_parsed | default([''])
    prefix: tag
    default_value: untagged
  - key: proxmox_status
    prefix: status
  # A dict gives <key>_<value>; with no value, just <key>.
  - key: "{'os': proxmox_ostype | default('')}"
    trailing_separator: false
  # owner comes from group_vars/proxmox_pool_pool1/.
  - key: owner
    prefix: owner
groups:
  # guest_tags is set by compose below, which runs first.
  web_prod: "['web', 'prod'] is subset(guest_tags)"
  prod_down: "'prod' in guest_tags and proxmox_status is eq('stopped')"
  local_domain: inventory_hostname is search('\\.home\\.arpa$')
compose:
  guest_tags: proxmox_tags_parsed | default([])
  ansible_host: (proxmox_ipconfig0 | default(proxmox_net0)).ip | split('/') | first
